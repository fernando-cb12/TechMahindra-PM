spring.application.name=backend

# Auth / JWT (override in env or use application-auth.example.properties as a template)
app.security.jwt.secret=${JWT_SECRET:please-change-me-use-at-least-32-bytes-for-hs256-in-production}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# DataSource + Flyway configuration.
# - In Docker, set env vars: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
# - Locally, the defaults below point to the local Postgres (adjust as needed).

# todo: add env example and how to export, first check if its possible on windows 
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# AWS S3 uploads. Override these with environment variables.
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
aws.s3.presigned-url-expiration-seconds=${AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS:300}

# AWS SES transactional email. Use separate IAM credentials from S3.
aws.ses.enabled=${AWS_SES_ENABLED:false}
aws.ses.region=${AWS_SES_REGION:us-east-1}
aws.ses.from-email=${AWS_SES_FROM_EMAIL:noreply@collabx.studio}
aws.ses.access-key=${AWS_SES_ACCESS_KEY_ID:}
aws.ses.secret-key=${AWS_SES_SECRET_ACCESS_KEY:}

# Azure OpenAI / Microsoft Foundry for AI workspace imports.
# Preferred Foundry v1 endpoint format: https://<resource>.services.ai.azure.com/openai/v1
# Legacy Azure OpenAI endpoint format is still supported: https://<resource>.openai.azure.com
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:}
# Only used for legacy endpoints that do not end with /openai/v1.
azure.openai.api-version=${AZURE_OPENAI_API_VERSION:2024-08-01-preview}
