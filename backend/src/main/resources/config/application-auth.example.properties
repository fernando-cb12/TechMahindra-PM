

# HS256 signing secret — must be long enough for HMAC-SHA (use a random 32+ byte value in production).
JWT_SECRET=replace-with-a-long-random-secret-at-least-32-bytes

# Access token lifetime in milliseconds (default below = 24 hours).
JWT_EXPIRATION_MS=86400000

# Comma-separated browser origins allowed to call the API (CORS).
APP_CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
